name: school_connect
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.10.0
  cloud_firestore: ^6.5.0
  image_picker: ^1.1.2
  firebase_auth: ^6.5.2
  file_picker: ^11.0.2
  csv: ^8.0.0
  firebase_storage: ^13.4.2
  http: ^1.6.0
  intl: ^0.20.2
  dotted_border: ^3.1.0
  cloudinary_public: ^0.23.1
  pdf: ^3.10.7
  printing: ^5.11.0
  excel: ^4.0.6
  url_launcher: ^6.3.0
  syncfusion_flutter_pdfviewer: ^28.1.35
  dio: ^5.0.0
  gal: ^2.0.0 
  permission_handler: ^11.0.0
  path_provider: ^2.1.6
  firebase_messaging: ^16.5.0
  onesignal_flutter: ^5.2.6
  
 
  

  



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/school.png
    - assets/app_icon.jpeg
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.jpeg"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/logo.png"
  android: true
  ios: true
  web: true

  android_12:
    color: "#FFFFFF"
    image: "assets/logo.png"